<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" role="img" aria-label="Unified Single-URL 3D WebGL Orbit Graph and Federated Search Hub">
  <defs>
    <clipPath id="hubClip">
      <rect x="0" y="0" width="1200" height="430" rx="16" ry="16"/>
    </clipPath>
    <filter id="hubShadow" x="-4%" y="-4%" width="108%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1F2328" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Outer Card -->
  <g clip-path="url(#hubClip)">
    <rect x="0" y="0" width="1200" height="430" fill="#FFFFFF"/>
    <rect x="0" y="0" width="300" height="6" fill="#4285F4"/>
    <rect x="300" y="0" width="300" height="6" fill="#EA4335"/>
    <rect x="600" y="0" width="300" height="6" fill="#FBBC04"/>
    <rect x="900" y="0" width="300" height="6" fill="#34A853"/>
  </g>
  <rect x="0.75" y="0.75" width="1198.5" height="428.5" rx="16" ry="16" fill="none" stroke="#DADCE0" stroke-width="1.5"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- Top Unified App Bar Mockup (:8765) -->
    <g filter="url(#hubShadow)">
      <rect x="32" y="26" width="1136" height="64" rx="12" fill="#F8F9FA" stroke="#DADCE0" stroke-width="1.5"/>
    </g>
    <!-- Crystal Diamond Emblem -->
    <polygon points="64,42 78,58 64,74 50,58" fill="#E8F0FE" stroke="#1A73E8" stroke-width="2"/>
    <polygon points="64,48 72,58 64,68 56,58" fill="#4285F4"/>

    <text x="92" y="54" font-size="15.5" font-weight="700" fill="#202124">Knowledge Compiler Web UI</text>
    <text x="92" y="72" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#1A73E8">http://127.0.0.1:8765/ · Zero-CDN Single-URL App</text>

    <!-- Mode Switcher Pills -->
    <rect x="448" y="41" width="122" height="34" rx="17" fill="#E8F0FE" stroke="#1A73E8" stroke-width="1.5"/>
    <text x="509" y="62" font-size="12" font-weight="700" fill="#174EA6" text-anchor="middle">Search Hub</text>

    <rect x="580" y="41" width="122" height="34" rx="17" fill="#FFFFFF" stroke="#DADCE0" stroke-width="1.2"/>
    <text x="641" y="62" font-size="12" font-weight="600" fill="#3C4043" text-anchor="middle">2D Force</text>

    <rect x="712" y="41" width="154" height="34" rx="17" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <text x="789" y="62" font-size="12" font-weight="700" fill="#065F46" text-anchor="middle">3D WebGL Orbit</text>

    <!-- Air-Gap Toggle Pill -->
    <rect x="908" y="41" width="242" height="34" rx="17" fill="#FEF7E0" stroke="#E37400" stroke-width="1.5"/>
    <circle cx="928" cy="58" r="5" fill="#E37400"/>
    <text x="1038" y="62" font-size="11.5" font-weight="700" fill="#7A3E00" text-anchor="middle">Local-First · Optional Git</text>

    <!-- ============================================================== -->
    <!-- LEFT CARD: MODE 1 - FEDERATED SEARCH HUB                       -->
    <!-- ============================================================== -->
    <g filter="url(#hubShadow)">
      <rect x="32" y="110" width="554" height="292" rx="12" fill="#F8FAFF" stroke="#1A73E8" stroke-width="2"/>
    </g>
    <rect x="50" y="126" width="166" height="22" rx="11" fill="#E8F0FE"/>
    <text x="133" y="141" font-size="10.5" font-weight="700" fill="#174EA6" text-anchor="middle" letter-spacing="0.4">MODE 1 · SEARCH HUB</text>

    <text x="50" y="170" font-size="16.5" font-weight="700" fill="#202124">Instant In-Memory BM25 Search Hub</text>
    <line x1="50" y1="184" x2="568" y2="184" stroke="#D2E3FC" stroke-width="1"/>

    <rect x="50" y="198" width="518" height="56" rx="8" fill="#FFFFFF" stroke="#D2E3FC" stroke-width="1.2"/>
    <text x="66" y="220" font-size="13" font-weight="700" fill="#174EA6">Zero-Index BM25 Ranking &amp; Duplicate Guard</text>
    <text x="66" y="240" font-size="12" fill="#5F6368">Multi-field Okapi BM25 across titles, tags &amp; prose with zero .sqlite files</text>

    <rect x="50" y="264" width="518" height="56" rx="8" fill="#FFFFFF" stroke="#D2E3FC" stroke-width="1.2"/>
    <text x="66" y="286" font-size="13" font-weight="700" fill="#174EA6">1-Click Sample Vault &amp; Shared Pattern Filters</text>
    <text x="66" y="306" font-size="12" fill="#5F6368">Switch between Local Vault, optional shared Git patterns &amp; 21-note Sample Vault</text>

    <rect x="50" y="330" width="518" height="56" rx="8" fill="#FFFFFF" stroke="#D2E3FC" stroke-width="1.2"/>
    <text x="66" y="352" font-size="13" font-weight="700" fill="#174EA6">Actionable Result Cards &amp; 1-Click Navigation</text>
    <text x="66" y="372" font-size="12" fill="#5F6368">Locate in 3D Orbit, open Mermaid/table Reader, or export standalone HTML</text>

    <!-- ============================================================== -->
    <!-- RIGHT CARD: MODES 2 & 3 - 3D WEBGL ORBIT & 2D GRAPH            -->
    <!-- ============================================================== -->
    <g filter="url(#hubShadow)">
      <rect x="614" y="110" width="554" height="292" rx="12" fill="#F2FDF8" stroke="#059669" stroke-width="2"/>
    </g>
    <rect x="632" y="126" width="224" height="22" rx="11" fill="#D1FAE5"/>
    <text x="744" y="141" font-size="10.5" font-weight="700" fill="#065F46" text-anchor="middle" letter-spacing="0.4">MODES 2 &amp; 3 · 60 FPS GRAPH</text>

    <text x="632" y="170" font-size="16.5" font-weight="700" fill="#202124">3D WebGL Orbit (Default) &amp; 2D Force Graph</text>
    <line x1="632" y1="184" x2="1150" y2="184" stroke="#A7F3D0" stroke-width="1"/>

    <rect x="632" y="198" width="518" height="56" rx="8" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1.2"/>
    <text x="648" y="220" font-size="13" font-weight="700" fill="#065F46">WebGL2/WebGL1 Shaders + Batched Turbo Fallback</text>
    <text x="648" y="240" font-size="12" fill="#5F6368">Sustains 60 FPS even on GPU-less Linux VMs (1 stroke + 1 fill per frame)</text>

    <rect x="632" y="264" width="518" height="56" rx="8" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1.2"/>
    <text x="648" y="286" font-size="13" font-weight="700" fill="#065F46">WASD Camera Flight &amp; 3D Orbit Controls</text>
    <text x="648" y="306" font-size="12" fill="#5F6368">WASD / Arrow panning, Q/E zoom, Shift 2.5x sprint, and mouse orbit drag</text>

    <rect x="632" y="330" width="518" height="56" rx="8" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1.2"/>
    <text x="648" y="352" font-size="13" font-weight="700" fill="#065F46">x-kc-* Epistemic Edges &amp; Inline Mermaid/Table Reader</text>
    <text x="648" y="372" font-size="12" fill="#5F6368">1-hop / 2-hop BFS spotlighting, clickable relative .md links &amp; SVG Mermaid</text>
  </g>
</svg>
