<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 492" width="1200" height="492" role="img" aria-label="Compile Once into OKF v0.3, Consume Anywhere Architecture">
  <defs>
    <clipPath id="ecoClip">
      <rect x="0" y="0" width="1200" height="492" rx="16" ry="16"/>
    </clipPath>
    <filter id="ecoShadow" x="-4%" y="-4%" width="108%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1F2328" flood-opacity="0.06"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#1A73E8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#059669"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#8430CE"/>
    </marker>
  </defs>

  <g clip-path="url(#ecoClip)">
    <rect x="0" y="0" width="1200" height="492" fill="#FFFFFF"/>
    <rect x="0" y="0" width="300" height="6" fill="#4285F4"/>
    <rect x="300" y="0" width="300" height="6" fill="#EA4335"/>
    <rect x="600" y="0" width="300" height="6" fill="#FBBC04"/>
    <rect x="900" y="0" width="300" height="6" fill="#34A853"/>
  </g>
  <rect x="0.75" y="0.75" width="1198.5" height="490.5" rx="16" ry="16" fill="none" stroke="#DADCE0" stroke-width="1.5"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- Header -->
    <text x="34" y="39" font-size="19.5" font-weight="700" fill="#202124">Compile Once into OKF v0.3 · Consume Anywhere</text>
    <text x="34" y="60" font-size="13" fill="#5F6368">Transform unstructured documents and coding-agent sessions into a verified, local-first Markdown knowledge graph with zero vendor lock-in</text>

    <!-- ============================================================== -->
    <!-- STAGE 1: UNSTRUCTURED SOURCES                                  -->
    <!-- ============================================================== -->
    <g filter="url(#ecoShadow)">
      <rect x="32" y="80" width="244" height="334" rx="12" fill="#F8FAFF" stroke="#1A73E8" stroke-width="1.8"/>
    </g>
    <rect x="48" y="96" width="144" height="22" rx="11" fill="#E8F0FE"/>
    <text x="120" y="111" font-size="10.5" font-weight="700" fill="#174EA6" text-anchor="middle" letter-spacing="0.4">1 · RAW SOURCES</text>
    <text x="48" y="141" font-size="15" font-weight="700" fill="#202124">Messy Inputs</text>

    <rect x="48" y="156" width="212" height="52" rx="8" fill="#FFFFFF" stroke="#D2E3FC" stroke-width="1.2"/>
    <text x="62" y="177" font-size="12.5" font-weight="700" fill="#174EA6">Slide Decks (.pptx)</text>
    <text x="62" y="196" font-size="11" fill="#5F6368">Speaker notes &amp; raster diagrams</text>

    <rect x="48" y="218" width="212" height="52" rx="8" fill="#FFFFFF" stroke="#D2E3FC" stroke-width="1.2"/>
    <text x="62" y="239" font-size="12.5" font-weight="700" fill="#174EA6">PDFs &amp; Design Specs</text>
    <text x="62" y="258" font-size="11" fill="#5F6368">RFCs, reports &amp; whitepapers</text>

    <rect x="48" y="280" width="212" height="52" rx="8" fill="#FFFFFF" stroke="#D2E3FC" stroke-width="1.2"/>
    <text x="62" y="301" font-size="12.5" font-weight="700" fill="#174EA6">Office Docs &amp; Web</text>
    <text x="62" y="320" font-size="11" fill="#5F6368">.docx, .xlsx, .html &amp; URLs</text>

    <rect x="48" y="342" width="212" height="52" rx="8" fill="#FFFFFF" stroke="#D2E3FC" stroke-width="1.2"/>
    <text x="62" y="363" font-size="12.5" font-weight="700" fill="#174EA6">Agent Sessions</text>
    <text x="62" y="382" font-size="11" fill="#5F6368">/distill-session chat findings</text>

    <!-- Connector 1 -> 2 -->
    <line x1="276" y1="247" x2="310" y2="247" stroke="#1A73E8" stroke-width="2.4" marker-end="url(#arrowBlue)"/>

    <!-- ============================================================== -->
    <!-- STAGE 2: KNOWLEDGE COMPILER ENGINE                             -->
    <!-- ============================================================== -->
    <g filter="url(#ecoShadow)">
      <rect x="316" y="80" width="256" height="334" rx="12" fill="#FEF7E0" stroke="#E37400" stroke-width="1.8"/>
    </g>
    <rect x="332" y="96" width="166" height="22" rx="11" fill="#FDE293"/>
    <text x="415" y="111" font-size="10.5" font-weight="700" fill="#7A3E00" text-anchor="middle" letter-spacing="0.4">2 · LOCAL COMPILER</text>
    <text x="332" y="141" font-size="15" font-weight="700" fill="#202124">Knowledge Compiler</text>

    <rect x="332" y="156" width="224" height="52" rx="8" fill="#FFFFFF" stroke="#FDE293" stroke-width="1.2"/>
    <text x="346" y="177" font-size="12.5" font-weight="700" fill="#7A3E00">vault-extract</text>
    <text x="346" y="196" font-size="11" fill="#5F6368">SHA-256 cache + stdlib OOXML</text>

    <rect x="332" y="218" width="224" height="52" rx="8" fill="#FFFFFF" stroke="#FDE293" stroke-width="1.2"/>
    <text x="346" y="239" font-size="12.5" font-weight="700" fill="#7A3E00">vault-lint --strict</text>
    <text x="346" y="258" font-size="11" fill="#5F6368">Schema, link &amp; v0.2-&gt;v0.3 checks</text>

    <rect x="332" y="280" width="224" height="52" rx="8" fill="#FFFFFF" stroke="#FDE293" stroke-width="1.2"/>
    <text x="346" y="301" font-size="12.5" font-weight="700" fill="#7A3E00">vault-query &amp; vault-correct</text>
    <text x="346" y="320" font-size="11" fill="#5F6368">In-memory BM25 + tri-state sweep</text>

    <rect x="332" y="342" width="224" height="52" rx="8" fill="#FFFFFF" stroke="#FDE293" stroke-width="1.2"/>
    <text x="346" y="363" font-size="12.5" font-weight="700" fill="#7A3E00">10 Skills &amp; /wikiskill</text>
    <text x="346" y="382" font-size="11" fill="#5F6368">Portable SKILL.md + offline evals</text>

    <!-- Connector 2 -> 3 -->
    <line x1="572" y1="247" x2="606" y2="247" stroke="#059669" stroke-width="2.4" marker-end="url(#arrowGreen)"/>

    <!-- ============================================================== -->
    <!-- STAGE 3: CANONICAL OKF v0.3 BUNDLE                             -->
    <!-- ============================================================== -->
    <g filter="url(#ecoShadow)">
      <rect x="612" y="80" width="262" height="334" rx="12" fill="#F2FDF8" stroke="#059669" stroke-width="2"/>
    </g>
    <rect x="628" y="96" width="184" height="22" rx="11" fill="#D1FAE5"/>
    <text x="720" y="111" font-size="10.5" font-weight="700" fill="#065F46" text-anchor="middle" letter-spacing="0.4">3 · STANDARD OKF v0.3</text>
    <text x="628" y="141" font-size="15" font-weight="700" fill="#202124">Portable Bundle (.)</text>

    <rect x="628" y="156" width="230" height="52" rx="8" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1.2"/>
    <text x="642" y="177" font-size="12.5" font-weight="700" fill="#065F46">index.md &amp; wiki/**/index.md</text>
    <text x="642" y="196" font-size="11" fill="#5F6368">okf_version: "0.3" + §8 catalogs</text>

    <rect x="628" y="218" width="230" height="52" rx="8" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1.2"/>
    <text x="642" y="239" font-size="12.5" font-weight="700" fill="#065F46">Relative Markdown Links</text>
    <text x="642" y="258" font-size="11" fill="#5F6368">RFC 3986 .md edges (--portable-links)</text>

    <rect x="628" y="280" width="230" height="52" rx="8" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1.2"/>
    <text x="642" y="301" font-size="12.5" font-weight="700" fill="#065F46">x-kc-* Epistemic Keys (§4.1)</text>
    <text x="642" y="320" font-size="11" fill="#5F6368">Corroborates, extends, supersedes</text>

    <rect x="628" y="342" width="230" height="52" rx="8" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1.2"/>
    <text x="642" y="363" font-size="12.5" font-weight="700" fill="#065F46">Verified Trust &amp; log.md</text>
    <text x="642" y="382" font-size="11" fill="#5F6368">Freshness checks + frontmatter-free log</text>

    <!-- Connector 3 -> 4 -->
    <line x1="874" y1="247" x2="908" y2="247" stroke="#8430CE" stroke-width="2.4" marker-end="url(#arrowPurple)"/>

    <!-- ============================================================== -->
    <!-- STAGE 4: UNIVERSAL CONSUMERS                                   -->
    <!-- ============================================================== -->
    <g filter="url(#ecoShadow)">
      <rect x="914" y="80" width="254" height="334" rx="12" fill="#FAF5FF" stroke="#8430CE" stroke-width="1.8"/>
    </g>
    <rect x="930" y="96" width="160" height="22" rx="11" fill="#F3E8FD"/>
    <text x="1010" y="111" font-size="10.5" font-weight="700" fill="#5B21B6" text-anchor="middle" letter-spacing="0.4">4 · ANY CONSUMER</text>
    <text x="930" y="141" font-size="15" font-weight="700" fill="#202124">Open Ecosystem</text>

    <rect x="930" y="156" width="222" height="52" rx="8" fill="#FFFFFF" stroke="#E9D5FF" stroke-width="1.2"/>
    <circle cx="945" cy="173" r="4" fill="#34A853"/>
    <text x="957" y="177" font-size="12.5" font-weight="700" fill="#5B21B6">Generic OKF v0.3 Tools</text>
    <text x="944" y="196" font-size="11" fill="#5F6368">validate.py, okf-consume, viz.html</text>

    <rect x="930" y="218" width="222" height="52" rx="8" fill="#FFFFFF" stroke="#E9D5FF" stroke-width="1.2"/>
    <circle cx="945" cy="235" r="4" fill="#4285F4"/>
    <text x="957" y="239" font-size="12.5" font-weight="700" fill="#5B21B6">AI Coding Agents</text>
    <text x="944" y="258" font-size="11" fill="#5F6368">Antigravity, Gemini CLI, Claude, Codex</text>

    <rect x="930" y="280" width="222" height="52" rx="8" fill="#FFFFFF" stroke="#E9D5FF" stroke-width="1.2"/>
    <circle cx="945" cy="297" r="4" fill="#FBBC04"/>
    <text x="957" y="301" font-size="12.5" font-weight="700" fill="#5B21B6">60 FPS WebGL Workbench</text>
    <text x="944" y="320" font-size="11" fill="#5F6368">3D Orbit, 2D Force &amp; Mermaid Reader</text>

    <rect x="930" y="342" width="222" height="52" rx="8" fill="#FFFFFF" stroke="#E9D5FF" stroke-width="1.2"/>
    <circle cx="945" cy="359" r="4" fill="#A142F4"/>
    <text x="957" y="363" font-size="12.5" font-weight="700" fill="#5B21B6">Obsidian &amp; GitHub</text>
    <text x="944" y="382" font-size="11" fill="#5F6368">Native .md links + [[wikilinks]]</text>

    <!-- Bottom Proof Strip -->
    <rect x="32" y="432" width="1136" height="40" rx="10" fill="#F8F9FA" stroke="#DADCE0" stroke-width="1.2"/>
    <circle cx="52" cy="452" r="5" fill="#34A853"/>
    <text x="66" y="456" font-size="12" font-weight="700" fill="#202124">Verified Conformance:</text>
    <text x="206" y="456" font-size="12" fill="#3C4043">examples/starter-vault/ passes upstream OKF v0.3 validate.py --strict (32 files · 434 relative .md links · 0 errors, 0 warnings, 0 info)</text>
    <rect x="992" y="440" width="162" height="24" rx="12" fill="#E8F0FE" stroke="#1A73E8" stroke-width="1"/>
    <text x="1073" y="456" font-size="11" font-weight="700" fill="#174EA6" text-anchor="middle">100% Local-First (127.0.0.1)</text>
  </g>
</svg>
